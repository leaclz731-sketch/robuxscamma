<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Robux Gratuit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎁 Robux Gratuit</h1>
    <p>Entrez vos informations pour recevoir vos Robux.</p>
    <form id="robuxForm">
      <input type="text" id="username" placeholder="Pseudo Roblox" required>
      <input type="number" id="robux" placeholder="Nombre de Robux souhaités" min="100" required>
      <input type="tel" id="phone" placeholder="Numéro de téléphone (ex: +33612345678)" required>
      <button type="submit">Recevoir mes Robux</button>
    </form>
    <div id="error-message"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
